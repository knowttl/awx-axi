name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run build
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run typecheck
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run lint
        if: ${{ steps.release.outputs.release_created }}

      - run: npm test
        if: ${{ steps.release.outputs.release_created }}

      # setup-node's registry-url writes a placeholder auth token. Removing it
      # preserves the registry while allowing npm OIDC trusted publishing.
      - name: Enable OIDC trusted publishing (drop placeholder auth token)
        if: ${{ steps.release.outputs.release_created }}
        run: sed -i '/:_authToken=/d' "$NPM_CONFIG_USERCONFIG"

      - run: npm publish --access public --provenance
        if: ${{ steps.release.outputs.release_created }}
