no_ci: true
commands:
  test: npm run build && npm run typecheck && npm test
  lint: npm run lint
pr:
  base_branch: main
review:
  path_instructions:
    - path: "**"
      instructions: 'Test quality: apply the "Test quality" rules in AGENTS.md to every added or changed test. Flag each violation as a finding naming the rule number, the test file:line and the evidence. Respect the listed exemptions. Never ask for a test to be written first or only to raise coverage.'
